<div class="shop-container">
  <!-- Saldo Atual -->
  <header class="shop-header card">
    <h2>🏪 Loja de Recompensas</h2>
    <div class="user-balance">
      <span>O teu saldo:</span>
      <strong class="coins-badge">🪙 {{ user().coins }} Moedas</strong>
    </div>
  </header>

  <!-- Filtros e Ordenação -->
  <section class="controls-bar card">
    <div class="filter-group">
      <label>📁 Categoria:</label>
      <div class="btn-group">
        <button 
          *ngFor="let cat of categories" 
          (click)="filterByCategory(cat)"
          [class.active]="selectedCategory() === cat"
          class="btn-filter"
        >
          {{ cat }}
        </button>
      </div>
    </div>

    <div class="filter-group">
      <label>📊 Ordenar por Preço:</label>
      <select [value]="sortByPrice()" (change)="setSortOrder($any($event.target).value)" class="select-sort">
        <option value="none">Padrão</option>
        <option value="asc">Mais barato ➔ Mais caro</option>
        <option value="desc">Mais caro ➔ Mais barato</option>
      </select>
    </div>
  </section>

  <!-- Grelha de Prêmios -->
  <section class="rewards-grid">
    <div *ngFor="let reward of filteredRewards()" class="reward-card card">
      <button class="btn-delete" (click)="removeReward(reward.id)" title="Eliminar Prémio">🗑️</button>
      
      <div class="reward-icon">{{ reward.icon || '🎁' }}</div>
      <span class="category-tag">{{ reward.category }}</span>
      
      <h3>{{ reward.title }}</h3>
      <p>{{ reward.description }}</p>

      <div class="reward-footer">
        <span class="cost-tag">🪙 {{ reward.cost }}</span>
        <button 
          class="btn btn-buy" 
          [disabled]="user().coins < reward.cost"
          (click)="buyReward(reward)"
        >
          Resgatar
        </button>
      </div>
    </div>

    <p *ngIf="filteredRewards().length === 0" class="no-items">
      Nenhum prémio encontrado nesta categoria.
    </p>
  </section>

  <hr class="divider" />

  <!-- Formulário para Criar Novo Prémio -->
  <section class="add-reward-section card">
    <h3>➕ Adicionar Novo Prémio à Loja</h3>
    <form [formGroup]="rewardForm" (ngSubmit)="addReward()" class="reward-form">
      <div class="form-row">
        <div class="form-group flex-2">
          <label for="title">Título do Prémio *</label>
          <input id="title" type="text" formControlName="title" placeholder="Ex: Ver um filme" />
        </div>

        <div class="form-group flex-1">
          <label for="cost">Custo (Moedas) *</label>
          <input id="cost" type="number" formControlName="cost" min="1" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label for="category">Categoria *</label>
          <select id="category" formControlName="category">
            <option value="Geral">Geral</option>
            <option value="Lazer">Lazer</option>
            <option value="Privilégios">Privilégios</option>
            <option value="Guloseimas">Guloseimas</option>
          </select>
        </div>

        <div class="form-group flex-1">
          <label for="icon">Ícone/Emoji</label>
          <input id="icon" type="text" formControlName="icon" placeholder="Ex: 🍿" />
        </div>
      </div>

      <div class="form-group">
        <label for="description">Descrição</label>
        <input id="description" type="text" formControlName="description" placeholder="Breve descrição da recompensa" />
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="rewardForm.invalid">
        Criar Prémio
      </button>
    </form>
  </section>
</div>
