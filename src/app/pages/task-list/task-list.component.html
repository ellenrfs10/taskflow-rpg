<div class="missions-container">
  <h2>⚔️ Quadro de Missões Domésticas</h2>

  <div *ngIf="errorMessage" class="alert-error">
    {{ errorMessage }}
  </div>

  <!-- Formulário Reativo (Reactive Forms) -->
  <section class="card create-mission-card">
    <h3>📜 Adicionar Nova Missão</h3>
    <form [formGroup]="taskForm" (ngSubmit)="createTask()" class="mission-form">
      <div class="form-group">
        <label for="title">Título da Missão *:</label>
        <input 
          type="text" 
          id="title" 
          formControlName="title"
          placeholder="Ex: Lavar a louça do jantar" 
        />
        <span 
          *ngIf="taskForm.get('title')?.invalid && taskForm.get('title')?.touched" 
          class="field-error"
        >
          O título é obrigatório e deve ter pelo menos 3 caracteres.
        </span>
      </div>

      <div class="form-group">
        <label for="description">Descrição:</label>
        <input 
          type="text" 
          id="description" 
          formControlName="description" 
          placeholder="Detalhes opcionais..." 
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="category">Categoria *:</label>
          <select id="category" formControlName="category">
            <option *ngFor="let cat of categories" [value]="cat">
              {{ cat | titlecase }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="urgency">Urgência *:</label>
          <select id="urgency" formControlName="urgency">
            <option *ngFor="let level of urgencyLevels" [value]="level">
              {{ level | titlecase }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-checkbox">
        <label>
          <input type="checkbox" formControlName="isCooperative" />
          🤝 Missão Cooperativa (Co-op com família/parceiro)
        </label>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="taskForm.invalid">
        ＋ Criar Missão
      </button>
    </form>
  </section>

  <!-- Lista utilizando o Componente Filho (TaskCardComponent) com @Input e @Output -->
  <section class="card missions-list-card">
    <h3>🎯 Missões Ativas & Concluídas</h3>

    <div *ngIf="isLoading" class="loading-state">
      Carregando missões do servidor... ⏳
    </div>

    <div *ngIf="!isLoading && tasks.length === 0" class="empty-state">
      Nenhuma missão registada. Adiciona a tua primeira missão acima! 🏰
    </div>

    <ul *ngIf="!isLoading && tasks.length > 0" class="task-list">
      <app-task-card 
        *ngFor="let t of tasks" 
        [task]="t" 
        (complete)="completeTask($event)" 
        (delete)="deleteTask($event)"
      >
      </app-task-card>
    </ul>
  </section>
</div>
